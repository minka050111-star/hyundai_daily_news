<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>현대차 대외협력 뉴스 트래커</title>
<style>
  :root {
    color-scheme: light;
    --bg: #f7f7f5;
    --surface: #ffffff;
    --text: #14181f;
    --text-secondary: #52545c;
    --muted: #8a8d94;
    --border: #e4e4e0;
    --accent: #1f4fa8;
    --accent-soft: #e7edf9;
    --chip-bg: #eef1f6;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      color-scheme: dark;
      --bg: #121316;
      --surface: #1b1c20;
      --text: #f2f2f0;
      --text-secondary: #c7c8cc;
      --muted: #8c8e94;
      --border: #2c2d31;
      --accent: #6d9bf0;
      --accent-soft: #1e2a42;
      --chip-bg: #22242a;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: "Pretendard", -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", sans-serif;
    padding: 32px 16px 64px;
  }
  .wrap { max-width: 880px; margin: 0 auto; }
  header { margin-bottom: 28px; }
  h1 { font-size: 1.55rem; margin: 0 0 6px; letter-spacing: -0.02em; }
  .sub { color: var(--text-secondary); font-size: 0.92rem; margin: 0; }

  .controls {
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
    margin: 22px 0 26px;
    padding: 14px 16px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
  }
  .controls label { font-size: 0.85rem; color: var(--text-secondary); }
  select, button {
    font: inherit;
    font-size: 0.92rem;
    padding: 8px 12px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text);
  }
  button {
    cursor: pointer;
    border-color: var(--accent);
    color: var(--accent);
    background: var(--accent-soft);
  }
  button:hover { filter: brightness(1.05); }
  .count-pill {
    margin-left: auto;
    font-size: 0.8rem;
    color: var(--muted);
  }

  .tabs {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin: 0 0 22px;
  }
  .tab-btn {
    font: inherit;
    font-size: 0.86rem;
    padding: 7px 14px;
    border-radius: 999px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text-secondary);
    cursor: pointer;
  }
  .tab-btn:hover { border-color: var(--accent); color: var(--accent); }
  .tab-btn.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }
  .cat-tag {
    flex-shrink: 0;
    font-size: 0.72rem;
    padding: 3px 9px;
    border-radius: 999px;
    font-weight: 600;
    margin-top: 1px;
  }
  .cat-hyundai { background: var(--accent-soft); color: var(--accent); }
  .cat-industry { background: #e9f5ea; color: #2f7d3a; }
  .cat-geo { background: #fbeee0; color: #a85b12; }
  @media (prefers-color-scheme: dark) {
    .cat-industry { background: #1c3320; color: #7fd28c; }
    .cat-geo { background: #3a2a17; color: #f0ad5f; }
  }

  .status { color: var(--muted); font-size: 0.9rem; padding: 24px 4px; }

  .summary-box {
    margin-top: 22px;
    padding: 18px 20px;
    background: var(--accent-soft);
    border: 1px solid var(--accent);
    border-radius: 12px;
  }
  .summary-box .summary-head {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 8px;
    font-size: 0.86rem;
    font-weight: 700;
    color: var(--accent);
  }
  .summary-box p, .summary-box .md-list {
    margin: 0;
    font-size: 0.92rem;
    line-height: 1.6;
    color: var(--text);
  }
  .summary-box p + p, .summary-box .md-list + p, .summary-box p + .md-list { margin-top: 6px; }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 18px 20px;
    margin-bottom: 14px;
  }
  .card-head {
    display: flex;
    align-items: baseline;
    gap: 10px;
    margin-bottom: 8px;
  }
  .idx {
    font-variant-numeric: tabular-nums;
    font-size: 0.78rem;
    color: var(--muted);
    flex-shrink: 0;
  }
  .card h2 {
    font-size: 1.02rem;
    margin: 0;
    line-height: 1.4;
  }
  .card h2 a {
    color: var(--text);
    text-decoration: none;
  }
  .card h2 a:hover { color: var(--accent); text-decoration: underline; }
  .pub { font-size: 0.76rem; color: var(--muted); margin: 2px 0 10px; }
  .row { display: flex; gap: 8px; margin-top: 8px; align-items: flex-start; }
  .row .tag {
    flex-shrink: 0;
    font-size: 0.72rem;
    padding: 3px 8px;
    border-radius: 999px;
    background: var(--chip-bg);
    color: var(--text-secondary);
    margin-top: 1px;
  }
  .row .md-body { flex: 1; min-width: 0; }
  .row .md-body p, .row .md-body ul {
    margin: 0;
    font-size: 0.9rem;
    line-height: 1.55;
    color: var(--text-secondary);
  }
  .row .md-body p + p, .row .md-body ul + p, .row .md-body p + ul { margin-top: 4px; }
  .row.insight .md-body p, .row.insight .md-body ul { color: var(--text); }
  .row.insight .tag { background: var(--accent-soft); color: var(--accent); }

  .md-list { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 4px; }
  .md-list li { position: relative; padding-left: 14px; }
  .md-list li::before {
    content: "•";
    position: absolute;
    left: 0;
    color: var(--accent);
  }
  strong { color: var(--text); font-weight: 700; }
  .row.insight .md-list li::before,
  .summary-box .md-list li::before { color: var(--accent); }

  footer {
    margin-top: 36px;
    font-size: 0.78rem;
    color: var(--muted);
    text-align: center;
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>현대차 대외협력 뉴스 트래커</h1>
    <p class="sub">매일 자동 수집되는 현대자동차 대외협력 면접 준비용 뉴스 요약 — 날짜를 선택하면 과거 기록도 확인할 수 있습니다.</p>
  </header>

  <div class="controls">
    <label for="date-select">날짜</label>
    <select id="date-select"></select>
    <button id="latest-btn" type="button">최신으로</button>
    <span class="count-pill" id="count-pill"></span>
  </div>

  <div class="tabs" id="tabs"></div>

  <div id="content">
    <div class="status">불러오는 중...</div>
  </div>

  <div id="cat-summary"></div>

  <footer>매일 오전 9시(KST) GitHub Actions로 자동 갱신 · 데이터는 Naver 뉴스 검색 API 기반</footer>
</div>

<script>
(function () {
  const CATEGORIES = ["전체", "현대자동차", "자동차 산업", "국제 정세"];
  const CAT_CLASS = {
    "현대자동차": "cat-hyundai",
    "자동차 산업": "cat-industry",
    "국제 정세": "cat-geo",
  };

  const dateSelect = document.getElementById("date-select");
  const content = document.getElementById("content");
  const countPill = document.getElementById("count-pill");
  const latestBtn = document.getElementById("latest-btn");
  const tabsEl = document.getElementById("tabs");
  const catSummaryEl = document.getElementById("cat-summary");

  let currentItems = [];
  let currentSummaries = {};
  let currentCategory = "전체";

  function fmtDate(iso) {
    try {
      const d = new Date(iso + "T00:00:00+09:00");
      return d.toLocaleDateString("ko-KR", { year: "numeric", month: "long", day: "numeric", weekday: "short" });
    } catch (e) {
      return iso;
    }
  }

  function fmtPub(pubDate) {
    if (!pubDate) return "";
    try {
      const d = new Date(pubDate);
      return d.toLocaleString("ko-KR", { month: "short", day: "numeric", hour: "2-digit", minute: "2-digit" });
    } catch (e) {
      return pubDate;
    }
  }

  function escapeHtml(s) {
    return (s || "").replace(/[&<>"']/g, (c) => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
    }[c]));
  }

  // 아주 가벼운 마크다운 렌더러: "- " 불릿과 "**볼드**"만 지원.
  // 항상 escapeHtml을 먼저 거치므로 원본 텍스트에 실제 HTML 태그가 있어도 안전하게 무해화됨.
  function mdToHtml(raw) {
    const escaped = escapeHtml(raw || "");
    const bolded = escaped.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
    const lines = bolded.split(/\n+/).map((l) => l.trim()).filter(Boolean);
    if (!lines.length) return "";

    let html = "";
    let inList = false;
    for (const line of lines) {
      if (line.startsWith("- ")) {
        if (!inList) { html += '<ul class="md-list">'; inList = true; }
        html += `<li>${line.slice(2)}</li>`;
      } else {
        if (inList) { html += "</ul>"; inList = false; }
        html += `<p>${line}</p>`;
      }
    }
    if (inList) html += "</ul>";
    return html;
  }

  function renderSummary() {
    const text = currentSummaries && currentSummaries[currentCategory];
    if (!text) {
      catSummaryEl.innerHTML = "";
      return;
    }
    catSummaryEl.innerHTML = `
      <div class="summary-box">
        <div class="summary-head">🗂 ${escapeHtml(currentCategory)} 요약</div>
        ${mdToHtml(text)}
      </div>
    `;
  }

  function renderTabs() {
    // 각 카테고리별 건수 계산 (전체 = 이 날짜 전체 기사 수)
    const counts = { "전체": currentItems.length };
    for (const cat of CATEGORIES.slice(1)) {
      counts[cat] = currentItems.filter((it) => (it.category || "자동차 산업") === cat).length;
    }
    tabsEl.innerHTML = CATEGORIES.map((cat) => `
      <button type="button" class="tab-btn${cat === currentCategory ? " active" : ""}" data-cat="${escapeHtml(cat)}">
        ${escapeHtml(cat)} <span style="opacity:.7">${counts[cat]}</span>
      </button>
    `).join("");
    tabsEl.querySelectorAll(".tab-btn").forEach((btn) => {
      btn.addEventListener("click", () => {
        currentCategory = btn.getAttribute("data-cat");
        renderTabs();
        renderCards();
        renderSummary();
      });
    });
  }

  function renderCards() {
    const filtered = currentCategory === "전체"
      ? currentItems
      : currentItems.filter((it) => (it.category || "자동차 산업") === currentCategory);

    if (!filtered.length) {
      content.innerHTML = '<div class="status">이 카테고리에는 표시할 기사가 없습니다.</div>';
      countPill.textContent = "";
      return;
    }
    countPill.textContent = filtered.length + "건";
    content.innerHTML = filtered.map((it, i) => {
      const cat = it.category || "자동차 산업";
      const catClass = CAT_CLASS[cat] || "cat-industry";
      return `
      <article class="card">
        <div class="card-head">
          <span class="idx">${String(i + 1).padStart(2, "0")}</span>
          <span class="cat-tag ${catClass}">${escapeHtml(cat)}</span>
          <h2><a href="${escapeHtml(it.link)}" target="_blank" rel="noopener">${escapeHtml(it.title)}</a></h2>
        </div>
        <div class="pub">${escapeHtml(fmtPub(it.pubDate))}</div>
        <div class="row">
          <span class="tag">핵심내용</span>
          <div class="md-body">${mdToHtml(it.core)}</div>
        </div>
        <div class="row insight">
          <span class="tag">면접 인사이트</span>
          <div class="md-body">${mdToHtml(it.insight)}</div>
        </div>
      </article>
    `;
    }).join("");
  }

  function renderDay(day) {
    currentItems = (day && day.items) || [];
    currentSummaries = (day && day.category_summaries) || {};
    currentCategory = "전체";
    if (!currentItems.length) {
      tabsEl.innerHTML = "";
      content.innerHTML = '<div class="status">이 날짜에는 저장된 기사가 없습니다.</div>';
      countPill.textContent = "";
      catSummaryEl.innerHTML = "";
      return;
    }
    renderTabs();
    renderCards();
    renderSummary();
  }

  async function loadDay(dateStr) {
    content.innerHTML = '<div class="status">불러오는 중...</div>';
    try {
      const res = await fetch(`data/${dateStr}.json`, { cache: "no-store" });
      if (!res.ok) throw new Error("not found");
      const day = await res.json();
      renderDay(day);
    } catch (e) {
      content.innerHTML = '<div class="status">해당 날짜의 데이터를 불러오지 못했습니다.</div>';
      countPill.textContent = "";
    }
  }

  async function init() {
    let dates = [];
    try {
      const res = await fetch("data/index.json", { cache: "no-store" });
      dates = await res.json();
    } catch (e) {
      content.innerHTML = '<div class="status">아직 수집된 데이터가 없습니다. GitHub Actions 워크플로가 처음 실행되면 이곳에 표시됩니다.</div>';
      return;
    }
    if (!dates || !dates.length) {
      content.innerHTML = '<div class="status">아직 수집된 데이터가 없습니다. GitHub Actions 워크플로가 처음 실행되면 이곳에 표시됩니다.</div>';
      return;
    }
    dateSelect.innerHTML = dates.map((d) => `<option value="${d}">${fmtDate(d)}</option>`).join("");
    dateSelect.value = dates[0];
    await loadDay(dates[0]);

    dateSelect.addEventListener("change", () => loadDay(dateSelect.value));
    latestBtn.addEventListener("click", () => {
      dateSelect.value = dates[0];
      loadDay(dates[0]);
    });
  }

  init();
})();
</script>
</body>
</html>
